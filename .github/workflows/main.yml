name: Cloud Tests

on:
  workflow_dispatch: # Добавляет кнопку "Run workflow"
  push:
    branches: [ "main", "dev", "tests" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  main-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 2
    
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest] #windows-latest, ubuntu-latest, ubuntu-24.04-arm
        compiler: [GCC, CLANG] #GCC, CLANG
        standard: [C++98, C++11] #C++98, C++11

    steps:
      - name: Download and Checkout Code
        uses: actions/checkout@v4

      - name: Compiling Tests (Linux)
        if: contains(matrix.os, 'ubuntu')
        run: |
          cd tests/
          chmod +x ./make_test.sh
          bash ./make_test.sh ${{ matrix.compiler }} ${{ matrix.standard }} x64

      - name: Executing Tests (Linux)
        if: contains(matrix.os, 'ubuntu')
        run: |
          cd tests/
          ./tests

      - name: Compiling Tests (Windows)
        if: contains(matrix.os, 'windows')
        shell: cmd
        run: |
          cd tests/
          make_test.bat ${{ matrix.compiler }} ${{ matrix.standard }} x64

      - name: Executing Tests (Windows)
        if: contains(matrix.os, 'windows')
        shell: cmd
        run: |
          cd tests/
          tests.exe
          
  qemu-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [riscv64, aarch64] #riscv64, aarch64, riscv32, arm
        compiler: [GCC, CLANG] #GCC, CLANG
        standard: [C++98] #C++98, C++11

    steps:
      - name: Download and Checkout Code
        uses: actions/checkout@v4
        
      - name: Install Dependencies
        run: |
          cd tests/
          sudo apt update -q && sudo apt install g++-${{ matrix.arch }}-linux-gnu -y -q --no-install-recommends
          
      - name: Cross-Compiling Tests for ${{ matrix.arch }}
        run: |
          cd tests/
          chmod +x ./make_test.sh
          ARCH="RISCV64"
          [ "${{ matrix.arch }}" = "aarch64" ] && ARCH="ARM64"
          [ "${{ matrix.arch }}" = "riscv32" ] && ARCH="RISCV32"
          bash ./make_test.sh ${{ matrix.compiler }} ${{ matrix.standard }} $ARCH
          
      # - name: Install Dependencies & Compiling Tests (In Container)
        # uses: uraimo/run-on-arch-action@v3
        # timeout-minutes: 3
        # with:
          # arch: ${{ matrix.arch }}
          # distro: ubuntu22.04
          # run: |
            # PKG="g++" 
            # [ "${{ matrix.compiler }}" = "CLANG" ] && PKG="clang"
            # apt update -q && apt install $PKG -y -q --no-install-recommends
            # cd tests/
            # chmod +x ./make_test.sh
            # bash ./make_test.sh ${{ matrix.compiler }} ${{ matrix.standard }}

      - name: Executing Tests (QEMU)
        uses: uraimo/run-on-arch-action@v3
        timeout-minutes: 1
        with:
          arch: ${{ matrix.arch }}
          distro: ubuntu22.04
          run: |
            cd tests/
            ./tests
            
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Download and Checkout Code
        uses: actions/checkout@v4
        
      - name: Install lcov
        run: |
          sudo apt update -q && sudo apt install lcov -y -q --no-install-recommends
      
      - name: Compiling & Execute Tests
        run: |
          cd tests/
          chmod +x ./make_test.sh
          bash ./make_test.sh COVERAGE
          
      - name: Generate Report
        run: |
          cd tests/
          lcov --capture --directory . --output-file lcov.info --rc lcov_branch_coverage=1 --ignore-errors inconsistent
          lcov --remove lcov.info '/usr/*' 'tests/*' --output-file lcov.info --ignore-errors inconsistent

      - name: Push to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: tests/lcov.info

  winxp-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
    
    strategy:
      max-parallel: 1 # Последовательное выполнение
      matrix:
        runners: [winxp] #winxp
        compiler: [GCC3, GCC] #GCC3, GCC, CLANG
        standard: [C++98, C++11] #C++98, C++11
        exclude:
          - compiler: GCC3
            standard: C++11
          - compiler: GCC
            standard: C++98

    steps:
      - name: Local - Download and Checkout Code
        uses: actions/checkout@v4
       
      - name: Remote - Download Code
        run: |
          cd scripts/
          node ci-client.js --runner ${{ matrix.runners }} --token $RUNNER_TOKEN --branch ${{ github.ref_name }} getCode
          
      - name: Remote - Compiling Tests
        run: |
          cd scripts/
          node ci-client.js --runner ${{ matrix.runners }} --token $RUNNER_TOKEN compile ${{ matrix.compiler }} ${{ matrix.standard }} x32

      - name: Remote - Executing Tests
        run: |
          cd scripts/
          node ci-client.js --runner ${{ matrix.runners }} --token $RUNNER_TOKEN tests

  # win7-gcc-4.9.2:
    # runs-on: self-hosted win7
  # debian-old-gcc-4.9.2:
    # runs-on: self-hosted linux2.6