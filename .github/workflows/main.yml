name: Cloud Tests

on:
  workflow_dispatch: # Добавляет кнопку "Run workflow"
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  main-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 2
    
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest] #ubuntu-24.04-arm
        compiler: [GCC, CLANG]
        standard: [C++98, C++11]

    steps:
      - name: Download and Checkout Code
        uses: actions/checkout@v4

      - name: Compiling Tests (Linux)
        if: contains(matrix.os, 'ubuntu')
        run: |
          cd tests/
          chmod +x ./make_test.sh
          bash ./make_test.sh ${{ matrix.compiler }} ${{ matrix.standard }} x64

      - name: Executing Tests (Linux)
        if: contains(matrix.os, 'ubuntu')
        run: |
          cd tests/
          ./tests

      - name: Compiling Tests (Windows)
        if: contains(matrix.os, 'windows')
        shell: cmd
        run: |
          cd tests/
          make_test.bat ${{ matrix.compiler }} ${{ matrix.standard }} x64

      - name: Executing Tests (Windows)
        if: contains(matrix.os, 'windows')
        shell: cmd
        run: |
          cd tests/
          tests.exe
          
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Download and Checkout Code
        uses: actions/checkout@v4
      
      - name: Compiling & Execute Tests
        run: |
          cd tests/
          chmod +x ./make_test.sh
          bash ./make_test.sh COVERAGE
          
      - name: Install lcov
        run: |
          sudo apt update -q && sudo apt-get install lcov -y -q --no-install-recommends
          
      - name: Generate Report
        run: |
          cd tests/
          lcov --capture --directory . --output-file lcov.info --rc lcov_branch_coverage=1
          lcov --remove lcov.info '/usr/*' 'tests/*' --output-file lcov.info

      - name: Push to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: tests/lcov.info

